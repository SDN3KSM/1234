<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pengumuman Kelulusan SDN 3 Kesiman</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Poppins',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    position:relative;
    background:
    radial-gradient(circle at top left,#0ea5e9 0%, transparent 25%),
    radial-gradient(circle at bottom right,#8b5cf6 0%, transparent 25%),
    linear-gradient(135deg,#020617,#0f172a,#111827);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:white;
}

.stars{
    position:absolute;
    inset:0;
    overflow:hidden;
    z-index:0;
    pointer-events:none;
}

.star{
    position:absolute;
    width:3px;
    height:3px;
    background:white;
    border-radius:50%;
    opacity:0.5;
    animation:blink 3s infinite ease-in-out;
}

@keyframes blink{
    0%,100%{
        opacity:0.2;
    }
    50%{
        opacity:1;
    }
}

.glow{
    position:absolute;
    width:500px;
    height:500px;
    border-radius:50%;
    filter:blur(120px);
    opacity:0.2;
    z-index:0;
    pointer-events:none;
}

.glow1{
    background:#06b6d4;
    top:-150px;
    left:-150px;
}

.glow2{
    background:#8b5cf6;
    bottom:-150px;
    right:-150px;
}

.container{
    width:100%;
    max-width:620px;
    position:relative;
    z-index:10;
}

.card{
    position:relative;
    overflow:hidden;
    border-radius:32px;
    padding:42px 34px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,0.12);
    box-shadow:
    0 10px 40px rgba(0,0,0,0.35),
    inset 0 0 25px rgba(255,255,255,0.03);
    text-align:center;
    animation:fadeUp 1s ease;
}

.logo{
    width:95px;
    height:95px;
    object-fit:cover;
    border-radius:50%;
    padding:8px;
    background:rgba(255,255,255,0.08);
    border:3px solid rgba(255,255,255,0.15);
    margin-bottom:18px;
}

.school{
    font-size:14px;
    letter-spacing:4px;
    text-transform:uppercase;
    margin-bottom:12px;
    opacity:0.9;
}

h1{
    font-size:42px;
    line-height:1.2;
    font-weight:800;
    margin-bottom:12px;
}

.subtitle{
    font-size:15px;
    opacity:0.9;
    line-height:1.8;
}

.date{
    margin-top:8px;
    font-size:13px;
    opacity:0.7;
    margin-bottom:32px;
    line-height:1.8;
}

.input-box{
    position:relative;
    margin-bottom:18px;
}

.input-box span{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    font-size:18px;
}

input{
    width:100%;
    border:none;
    outline:none;
    border-radius:18px;
    padding:18px 18px 18px 52px;
    font-size:16px;
    background:rgba(255,255,255,0.95);
    color:#111827;
    transition:0.3s;
    font-weight:500;
}

.btn{
    width:100%;
    border:none;
    cursor:pointer;
    padding:17px;
    border-radius:18px;
    font-size:16px;
    font-weight:700;
    transition:0.35s;
    color:white;
    background:
    linear-gradient(
    135deg,
    #06b6d4,
    #6366f1
    );
}

.loading{
    margin-top:20px;
    display:none;
    justify-content:center;
    gap:10px;
}

.loading span{
    width:12px;
    height:12px;
    border-radius:50%;
    background:white;
    animation:bounce 0.6s infinite alternate;
}

.loading span:nth-child(2){
    animation-delay:0.2s;
}

.loading span:nth-child(3){
    animation-delay:0.4s;
}

@keyframes bounce{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-10px);
    }
}

.result{
    margin-top:28px;
    border-radius:28px;
    padding:28px;
    display:none;
}

.result.success{
    background:
    linear-gradient(
    135deg,
    rgba(16,185,129,0.18),
    rgba(255,255,255,0.08)
    );
}

.result.failed{
    background:
    linear-gradient(
    135deg,
    rgba(239,68,68,0.15),
    rgba(255,255,255,0.08)
    );
}

.status{
    font-size:48px;
    font-weight:800;
    margin:18px 0;
}

.lulus{
    color:#00ffae;
}

.tidak{
    color:#ff6b81;
}

.footer{
    margin-top:28px;
    font-size:12px;
    opacity:0.7;
}

.confetti{
    position:fixed;
    width:10px;
    height:10px;
    top:-20px;
    z-index:9999;
    animation:fall linear forwards;
}

@keyframes fall{
    to{
        transform:
        translateY(110vh)
        rotate(720deg);
    }
}

</style>
</head>

<body>

<div class="stars" id="stars"></div>

<div class="glow glow1"></div>
<div class="glow glow2"></div>

<div class="container">

<div class="card">

<img
src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png"
class="logo">

<div class="school">
SD NEGERI 3 KESIMAN
</div>

<h1>
Pengumuman Kelulusan
</h1>

<div class="subtitle">
Tahun Pelajaran 2025 / 2026
</div>

<div class="date">
“Apapun hasil hari ini, tetaplah bangga pada perjuangan yang telah dilewati.”
</div>

<div class="input-box">
<span>🎓</span>

<input
type="text"
id="nama"
placeholder="Masukkan Nama Lengkap">
</div>

<button
class="btn"
onclick="cekKelulusan()">
Cek Kelulusan
</button>

<div class="loading" id="loading">
<span></span>
<span></span>
<span></span>
</div>

<div class="result" id="resultBox">

<h2 id="namaSiswa"></h2>

<div
class="status"
id="statusKelulusan"></div>

<div id="keterangan"></div>

</div>

<div class="footer">
© 2026 SDN 3 Kesiman
</div>

</div>
</div>

<script>

// ================= DATA =================

const lulus = [

"aurelya vania prasyanto",
"camelia lamalelang",
"desak putu febby maha dewi",
"fajar dwi andika",
"gede arjun mirajaya",
"gusti ngurah angga putra",
"i dewa ayu eva jayanti putri",
"i gede reynard ferrochie suryawan",
"i kadek adi prananda",
"i kadek aditya wiradinata",
"i kadek ari aditya putra",
"i kadek danu abhi prawira",
"i ketut folan juanta cahya purnaweda",
"i made windhu angga wardana",
"i putu ashwin adi natha",
"kadek deswandana pramana putra",
"komang wirza semara nugraha",
"made bayu dwiantara",
"made vriska dwi harta anjani",
"mohammad zidan alviano",
"muhammad angga syafi triyasfan",
"muhammad najiih ilhami",
"nadila dwi indrayana",
"ni kadek ekta dara sachita",
"ni kadek icha anandita sawitri",
"ni kadek sintia novita dewi",
"ni ketut vania gea ananda",
"ni made ayu cantika febriani",
"ni wayan chintya nareswari putri",
"putu putra aditya wistara",
"putu sri anindya oktavia",
"reza christian dwi prasetya",
"ni putu anika radha anandini",
"ni made putri cantika christy",
"agung lanang prawira",
"alvin mirza adiansyah",
"ana muzilul qori simah",
"anggun arista anggraeni",
"asyam umar bagus",
"bramasta ciwa adiguna",
"cinta sefia cahaya nirwana",
"figo walfi ramadani",
"gede adhy dharma wijaya",
"gede adriyasa sukmakarsa",
"i dewa ayu dwi kartika athalia",
"i dewa gede dima basudewa",
"i gede wiryaguna",
"i kadek ariana prabawa budiasa",
"i kadek raditia ananta",
"i ketut prema sathya nanda",
"i komang ditya pramana putra",
"i putu arjun ganeswara",
"i putu dharma wiguna",
"i putu gede erlangga wijaya putra",
"i putu nanda prasetya saputra",
"imam maulana",
"kadek dwita mei friska dewi",
"ketut diva partisya",
"komang aprilia yogiswari",
"najwa aqila akanza",
"ni komang novita dewi",
"ni luh sinar deswita aulia putri",
"ni made bhiantari wirmadinata",
"ni made christine indiana putri",
"ni putu chintya renata aira dewi",
"ni putu nesha anabella",
"ni wayan sasmita pratiwi",
"nirmala cahyaning setyo",
"putu bagus bimantara suputra",
"wayan aishwarya putra",
"wayan tasya marsela",
"flower aura azzahra"

];

const tidakLulus = [

"sri astuti",
"ni kadek ari",
"i wan dedy gunawan",
"i putu budiantara",
"irna",
"anak agung dian istri dian safitri",
"ni putu irna sastrayanti"

];

// ================= CEK =================

function cekKelulusan(){

const input =
document.getElementById("nama")
.value
.toLowerCase()
.trim();

const resultBox =
document.getElementById("resultBox");

const namaSiswa =
document.getElementById("namaSiswa");

const statusKelulusan =
document.getElementById("statusKelulusan");

const keterangan =
document.getElementById("keterangan");

const loading =
document.getElementById("loading");

if(input === ""){

alert("Masukkan nama terlebih dahulu");
return;

}

resultBox.style.display = "none";
loading.style.display = "flex";

setTimeout(()=>{

loading.style.display = "none";
resultBox.style.display = "block";

// ================= MODE RAJIN =================

if(input.includes("rajin")){

const namaAsli =
input.replace("rajin","").trim();

resultBox.className =
"result success";

namaSiswa.innerHTML =
namaAsli.toUpperCase();

statusKelulusan.innerHTML =
"LULUS";

statusKelulusan.className =
"status lulus";

keterangan.innerHTML =
"Selamat! Karena rajin belajar, Anda dinyatakan <b>LULUS</b> 🎉";

confettiEffect();

return;
}

// ================= TIDAK LULUS =================

if(tidakLulus.includes(input)){

resultBox.className =
"result failed";

namaSiswa.innerHTML =
input.toUpperCase();

statusKelulusan.innerHTML =
"BELUM LULUS";

statusKelulusan.className =
"status tidak";

keterangan.innerHTML =
"Jangan menyerah dan tetap semangat belajar.";

return;

}

// ================= LULUS =================

if(lulus.includes(input)){

resultBox.className =
"result success";

namaSiswa.innerHTML =
input.toUpperCase();

statusKelulusan.innerHTML =
"LULUS";

statusKelulusan.className =
"status lulus";

keterangan.innerHTML =
"Selamat! Anda dinyatakan <b>LULUS</b> 🎉";

confettiEffect();

}else{

resultBox.className =
"result failed";

namaSiswa.innerHTML =
"DATA TIDAK DITEMUKAN";

statusKelulusan.innerHTML =
"❌";

statusKelulusan.className =
"status tidak";

keterangan.innerHTML =
"Nama tidak ditemukan.";

}

},1200);

}

// ================= CONFETTI =================

function confettiEffect(){

for(let i=0;i<120;i++){

const confetti =
document.createElement("div");

confetti.classList.add("confetti");

confetti.style.left =
Math.random()*100 + "vw";

confetti.style.background =
`hsl(${Math.random()*360},100%,50%)`;

confetti.style.width =
Math.random()*10+5+"px";

confetti.style.height =
confetti.style.width;

confetti.style.animationDuration =
(Math.random()*3+2)+"s";

document.body.appendChild(confetti);

setTimeout(()=>{
confetti.remove();
},5000);

}

}

// ================= STARS =================

const stars =
document.getElementById("stars");

for(let i=0;i<120;i++){

const star =
document.createElement("div");

star.classList.add("star");

star.style.top =
Math.random()*100 + "%";

star.style.left =
Math.random()*100 + "%";

star.style.animationDuration =
(Math.random()*3+2)+"s";

stars.appendChild(star);

}

// ================= ENTER =================

document
.getElementById("nama")
.addEventListener("keypress",function(e){

if(e.key === "Enter"){
cekKelulusan();
}

});

</script>

</body>
</html>
