<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengumuman Kelulusan SDN 3 Kesiman</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

<style>

*{margin:0;padding:0;box-sizing:border-box;}

body{
  font-family:'Poppins',sans-serif;
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
  background:
    radial-gradient(circle at top left,#0ea5e9 0%,transparent 25%),
    radial-gradient(circle at bottom right,#8b5cf6 0%,transparent 25%),
    linear-gradient(135deg,#020617,#0f172a,#111827);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  color:white;
}

.stars{position:absolute;inset:0;overflow:hidden;z-index:0;pointer-events:none;}

.star{
  position:absolute;width:3px;height:3px;
  background:white;border-radius:50%;opacity:0.5;
  animation:blink 3s infinite ease-in-out;
}

@keyframes blink{0%,100%{opacity:0.2;}50%{opacity:1;}}

.glow{
  position:absolute;width:500px;height:500px;
  border-radius:50%;filter:blur(120px);
  opacity:0.2;z-index:0;pointer-events:none;
}
.glow1{background:#06b6d4;top:-150px;left:-150px;}
.glow2{background:#8b5cf6;bottom:-150px;right:-150px;}

.container{width:100%;max-width:620px;position:relative;z-index:10;}

.card{
  position:relative;overflow:hidden;border-radius:32px;
  padding:42px 34px;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.12);
  box-shadow:0 10px 40px rgba(0,0,0,0.35),inset 0 0 25px rgba(255,255,255,0.03);
  text-align:center;
  animation:fadeUp 1s ease;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(30px);}
  to{opacity:1;transform:translateY(0);}
}

.logo{
  width:95px;height:95px;object-fit:cover;border-radius:50%;
  padding:8px;background:rgba(255,255,255,0.08);
  border:3px solid rgba(255,255,255,0.15);margin-bottom:18px;
}

.school{font-size:14px;letter-spacing:4px;text-transform:uppercase;margin-bottom:12px;opacity:0.9;}

h1{font-size:42px;line-height:1.2;font-weight:800;margin-bottom:12px;}

.subtitle{font-size:15px;opacity:0.9;line-height:1.8;}

.date{
  margin-top:8px;font-size:13px;opacity:0.7;
  margin-bottom:32px;line-height:1.8;
}

.input-box{position:relative;margin-bottom:18px;}

.input-box span{
  position:absolute;left:18px;top:50%;
  transform:translateY(-50%);font-size:18px;
}

input{
  width:100%;border:none;outline:none;border-radius:18px;
  padding:18px 18px 18px 52px;font-size:16px;
  background:rgba(255,255,255,0.95);color:#111827;
  transition:0.3s;font-weight:500;
}
input:focus{transform:scale(1.02);}

.btn{
  width:100%;border:none;cursor:pointer;
  padding:17px;border-radius:18px;font-size:16px;font-weight:700;
  transition:0.35s;color:white;
  background:linear-gradient(135deg,#06b6d4,#6366f1);
}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(99,102,241,0.4);}

.loading{margin-top:20px;display:none;justify-content:center;gap:10px;}
.loading span{
  width:12px;height:12px;border-radius:50%;background:white;
  animation:bounce 0.6s infinite alternate;
}
.loading span:nth-child(2){animation-delay:0.2s;}
.loading span:nth-child(3){animation-delay:0.4s;}

@keyframes bounce{from{transform:translateY(0);}to{transform:translateY(-10px);}}

/* ===== RESULT BOX ===== */

.result{
  margin-top:28px;border-radius:28px;padding:32px 28px;
  display:none;position:relative;overflow:hidden;
}

.result.success{
  background:linear-gradient(135deg,rgba(0,255,174,0.12),rgba(6,182,212,0.08),rgba(255,255,255,0.04));
  border:1px solid rgba(0,255,174,0.3);
  box-shadow:0 0 60px rgba(0,255,174,0.12),inset 0 0 40px rgba(0,255,174,0.04);
}

.result.success::before{
  content:'';position:absolute;inset:0;border-radius:28px;
  background:radial-gradient(circle at 50% 20%,rgba(0,255,174,0.1) 0%,transparent 65%);
  animation:glowPulse 2.5s ease-in-out infinite;pointer-events:none;
}

@keyframes glowPulse{0%,100%{opacity:0.4;}50%{opacity:1;}}

.result.failed{
  background:linear-gradient(135deg,rgba(139,92,246,0.12),rgba(99,102,241,0.08),rgba(255,255,255,0.04));
  border:1px solid rgba(139,92,246,0.28);
  box-shadow:0 0 40px rgba(139,92,246,0.1);
}

.result.not-found{
  background:linear-gradient(135deg,rgba(239,68,68,0.1),rgba(255,255,255,0.04));
  border:1px solid rgba(239,68,68,0.22);
}

.result-icon{
  display:block;font-size:60px;margin-bottom:10px;
  animation:iconPop 0.55s cubic-bezier(0.175,0.885,0.32,1.275) 0.15s both;
}

@keyframes iconPop{
  from{transform:scale(0) rotate(-30deg);opacity:0;}
  to{transform:scale(1) rotate(0deg);opacity:1;}
}

.result h2{
  font-size:17px;font-weight:700;margin-bottom:4px;
  opacity:0.95;letter-spacing:1px;
}

.status{
  font-size:48px;font-weight:800;
  margin:14px 0;min-height:60px;
}

.lulus{
  color:#00ffae;
  text-shadow:0 0 30px rgba(0,255,174,0.7),0 0 60px rgba(0,255,174,0.25);
}

.tidak{
  color:#a78bfa;
  text-shadow:0 0 25px rgba(167,139,250,0.5);
}

.tidak-merah{
  color:#fb7185;
  text-shadow:0 0 20px rgba(251,113,133,0.4);
  font-size:38px;
}

#keterangan{
  font-size:14px;line-height:1.85;opacity:0.88;margin-top:8px;
}

/* Rain drops for BELUM LULUS */
.rain-drop{
  position:absolute;
  width:1.5px;height:18px;
  background:linear-gradient(to bottom,transparent,rgba(167,139,250,0.55));
  animation:rainFall linear infinite;
  border-radius:0 0 2px 2px;
  pointer-events:none;top:0;
}

@keyframes rainFall{
  0%{transform:translateY(-20px);opacity:0;}
  15%{opacity:0.7;}
  85%{opacity:0.7;}
  100%{transform:translateY(280px);opacity:0;}
}

/* Fireworks overlay */
#fw-container{
  position:fixed;inset:0;
  pointer-events:none;z-index:9998;
}

.footer{margin-top:28px;font-size:12px;opacity:0.7;}

@media(max-width:600px){
  .card{padding:30px 22px;border-radius:24px;}
  h1{font-size:30px;}
  .status{font-size:38px;}
  .school{font-size:12px;letter-spacing:2px;}
  .result-icon{font-size:46px;}
}

</style>
</head>

<body>

<div id="fw-container"></div>
<div class="stars" id="stars"></div>
<div class="glow glow1"></div>
<div class="glow glow2"></div>

<div class="container">
<div class="card">

<img src="logo.jpeg" class="logo">

<div class="school">SD NEGERI 3 KESIMAN</div>

<h1>Pengumuman Kelulusan</h1>

<div class="subtitle">Tahun Ajaran 2025 / 2026</div>

<div class="date">
"Apapun hasil hari ini, tetaplah bangga pada perjuangan yang telah dilewati."
</div>

<div class="input-box">
<span>🎓</span>
<input type="text" id="nama" placeholder="Masukkan Nama Lengkap">
</div>

<button class="btn" onclick="cekKelulusan()">Cek Kelulusan</button>

<div class="loading" id="loading">
<span></span><span></span><span></span>
</div>

<div class="result" id="resultBox">
  <span id="resultIcon" class="result-icon"></span>
  <h2 id="namaSiswa"></h2>
  <div class="status" id="statusKelulusan"></div>
  <div id="keterangan"></div>
</div>

<div class="footer">© 2026 SDN 3 Kesiman</div>

</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fireworks-js@2.10.8/dist/index.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/typed.js@2.1.0/dist/typed.umd.js"></script>

<script>

// ================= DATA =================

const lulus = [

"aurelya vania prasyanto",
"camelia lamalelang",
"desak putu febby maha dewi",
"fajar dwi andika",
"gede arjun mirajaya",

"ni wayan chintya nareswari putri",

"reza christian dwi prasetya",
"ni putu anika radha anandini",
"ni made putri cantika christy",
"agung lanang prawira",
"ana muzilul qori simah",

"i dewa gede dima basudewa",
"i gede wiryaguna",
"i kadek ariana prabawa budiasa",
"i ketut prema sathya nanda",
"i putu arjun ganeswara",
"i putu dharma wiguna",
"i putu gede erlangga wijaya putra",
"i putu nanda prasetya saputra",
"kadek dwita mei friska dewi",
"ketut diva partisya",
"komang aprilia yogiswari",
"najwa aqila akanza",
"ni komang novita dewi",
"ni luh sinar deswita aulia putri",
"ni made bhiantari wirmadinata",
"ni made christine indiana putri",
"ni putu chintya renata aira dewi",
"ni putu nesha anabella",
"ni wayan sasmita pratiwi",
"nirmala cahyaning setyo",
"putu bagus bimantara suputra",
"wayan aishwarya putra",
"wayan tasya marsela",
"flower aura azzahra"

];

const tidakLulus = [

"sri astuti",
"I Komang Ditya Pramana Putra",
"I Kadek Raditia Ananta",
"Imam Maulana",
"Alvin Mirza Dansyah",
"ni kadek ari",
"i wan dedy gunawan",
"i putu budiantara",
"irna",
"anak agung dian istri dian safitri",
"ni putu irna sastrayanti",
"muhammad najiih ilhami",
"muhammad angga syafi triyasfan",

];

// ================= NORMALIZE =================

function normalizeText(text){
  return text.toLowerCase().trim().replace(/\s+/g," ");
}

// ================= STATE =================

let typedInstance = null;
let fwInstance = null;
let rainCleanup = null;

// ================= CEK =================

function cekKelulusan(){

  const inputRaw = document.getElementById("nama").value;
  const input = normalizeText(inputRaw);
  const loading = document.getElementById("loading");
  const resultBox = document.getElementById("resultBox");

  if(input === ""){
    alert("Masukkan nama terlebih dahulu");
    return;
  }

  resultBox.style.display = "none";
  loading.style.display = "flex";
  cleanupAnimations();

  setTimeout(()=>{

    loading.style.display = "none";

    // ================= MODE RAJIN =================

    if(input.includes("rajin")){
      const namaAsli = input.replace(/rajin/gi,"").trim();
      const namaZLulus = lulus.find(n => namaAsli.includes(normalizeText(n)));
      const namaZTidak = tidakLulus.find(n => namaAsli.includes(normalizeText(n)));
      if(namaZLulus || namaZTidak){
        tampilLulus(
          (namaZLulus || namaZTidak).toUpperCase(),
          "Selamat! Karena berjanji rajin belajar, Anda dinyatakan <b>LULUS</b> 🎉"
        );
      } else {
        tampilTidakDitemukan();
      }
      return;
    }

    // ================= TIDAK LULUS =================

    const cocokTidakLulus = tidakLulus.find(n => normalizeText(n) === input);
    if(cocokTidakLulus){
      tampilBelumLulus(
        cocokTidakLulus.toUpperCase(),
        "Jangan menyerah dan tetap semangat belajar. Setiap usaha tidak pernah sia-sia. Teruslah berjuang dan raih yang terbaik!"
      );
      return;
    }

    // ================= LULUS =================

    const cocokLulus = lulus.find(n => normalizeText(n) === input);
    if(cocokLulus){
      tampilLulus(
        cocokLulus.toUpperCase(),
        "Hari ini bukan hanya tentang kelulusan, tetapi tentang perjalanan panjang yang telah kalian lalui dengan usaha, doa, dan semangat yang luar biasa. Selamat atas kelulusan kalian dan teruslah mengejar cita-cita setinggi mungkin."
      );
      return;
    }

    tampilTidakDitemukan();

  }, 1200);

}

// ================= TAMPIL LULUS =================

function tampilLulus(nama, pesan){

  const resultBox = document.getElementById("resultBox");
  const namaSiswa = document.getElementById("namaSiswa");
  const resultIcon = document.getElementById("resultIcon");
  const keterangan = document.getElementById("keterangan");
  const statusEl = document.getElementById("statusKelulusan");

  resultIcon.textContent = "🎓";
  namaSiswa.textContent = nama;
  keterangan.innerHTML = pesan;
  statusEl.innerHTML = "";
  statusEl.className = "status lulus";

  resultBox.className = "result success";
  resultBox.style.display = "block";

  gsap.fromTo(resultBox,
    {opacity:0, scale:0.55, y:24},
    {opacity:1, scale:1, y:0, duration:0.75, ease:"back.out(1.6)"}
  );
  gsap.fromTo(namaSiswa,
    {opacity:0, y:16},
    {opacity:1, y:0, duration:0.5, delay:0.35, ease:"power2.out"}
  );
  gsap.fromTo(keterangan,
    {opacity:0, y:10},
    {opacity:1, y:0, duration:0.5, delay:0.85, ease:"power2.out"}
  );

  if(typedInstance){typedInstance.destroy();}
  typedInstance = new Typed("#statusKelulusan", {
    strings:["LULUS ✓"],
    typeSpeed:65,
    startDelay:400,
    showCursor:false,
  });

  setTimeout(()=>{
    confetti({
      particleCount:200,
      spread:110,
      origin:{y:0.6},
      colors:['#00ffae','#06b6d4','#6366f1','#fbbf24','#f472b6','#34d399']
    });
    setTimeout(()=>confetti({
      particleCount:90, angle:60, spread:60,
      origin:{x:0, y:0.65},
      colors:['#00ffae','#06b6d4','#fbbf24']
    }), 380);
    setTimeout(()=>confetti({
      particleCount:90, angle:120, spread:60,
      origin:{x:1, y:0.65},
      colors:['#6366f1','#f472b6','#34d399']
    }), 720);
  }, 500);

  startFireworks();

}

// ================= TAMPIL BELUM LULUS =================

function tampilBelumLulus(nama, pesan){

  const resultBox = document.getElementById("resultBox");
  const namaSiswa = document.getElementById("namaSiswa");
  const resultIcon = document.getElementById("resultIcon");
  const keterangan = document.getElementById("keterangan");
  const statusEl = document.getElementById("statusKelulusan");

  resultIcon.textContent = "💪";
  namaSiswa.textContent = nama;
  keterangan.innerHTML = pesan;
  statusEl.innerHTML = "";
  statusEl.className = "status tidak";

  resultBox.className = "result failed";
  resultBox.style.display = "block";

  gsap.fromTo(resultBox,
    {opacity:0, scale:0.85},
    {
      opacity:1, scale:1, duration:0.5, ease:"power2.out",
      onComplete:()=>{
        gsap.to(resultBox, {
          x:9, repeat:7, yoyo:true, duration:0.07, ease:"power2.inOut",
          onComplete:()=>gsap.set(resultBox,{x:0})
        });
      }
    }
  );
  gsap.fromTo(namaSiswa, {opacity:0,y:10}, {opacity:1,y:0,duration:0.5,delay:0.3});
  gsap.fromTo(keterangan, {opacity:0}, {opacity:1,duration:0.5,delay:0.75});

  if(typedInstance){typedInstance.destroy();}
  typedInstance = new Typed("#statusKelulusan", {
    strings:["BELUM LULUS"],
    typeSpeed:70,
    startDelay:400,
    showCursor:false,
  });

  startRain(resultBox);

}

// ================= TAMPIL TIDAK DITEMUKAN =================

function tampilTidakDitemukan(){

  const resultBox = document.getElementById("resultBox");
  const namaSiswa = document.getElementById("namaSiswa");
  const resultIcon = document.getElementById("resultIcon");
  const keterangan = document.getElementById("keterangan");
  const statusEl = document.getElementById("statusKelulusan");

  resultIcon.textContent = "🔍";
  namaSiswa.textContent = "DATA TIDAK DITEMUKAN";
  statusEl.innerHTML = "❌";
  statusEl.className = "status tidak-merah";
  keterangan.innerHTML = "Nama tidak ditemukan dalam daftar. Periksa kembali ejaan nama Anda.";

  resultBox.className = "result not-found";
  resultBox.style.display = "block";

  gsap.fromTo(resultBox,
    {opacity:0, y:18},
    {opacity:1, y:0, duration:0.5, ease:"power2.out"}
  );
  gsap.fromTo(namaSiswa, {opacity:0}, {opacity:1,duration:0.4,delay:0.2});
  gsap.fromTo(keterangan, {opacity:0}, {opacity:1,duration:0.4,delay:0.45});

}

// ================= FIREWORKS =================

function startFireworks(){

  const container = document.getElementById("fw-container");
  if(fwInstance){fwInstance.stop(); fwInstance = null;}

  try{
    const FW = (window.Fireworks && window.Fireworks.Fireworks)
             ? window.Fireworks.Fireworks
             : window.Fireworks;
    if(FW && typeof FW === 'function'){
      fwInstance = new FW(container, {
        rocketsPoint:{min:5,max:95},
        speed:2.5,
        acceleration:1.05,
        friction:0.97,
        gravity:1.5,
        particles:90,
        traceLength:3,
        traceSpeed:10,
        explosion:6,
        intensity:30,
        flickering:50,
        hue:{min:0,max:360},
        delay:{min:30,max:60},
        brightness:{min:50,max:80},
        decay:{min:0.015,max:0.03},
        opacity:0.55,
        autoresize:true,
        lineWidth:{
          explosion:{min:1,max:3},
          trace:{min:1,max:2}
        },
      });
      fwInstance.start();
      setTimeout(()=>{if(fwInstance){fwInstance.stop(); fwInstance=null;}}, 4500);
    }
  }catch(e){}

}

// ================= RAIN =================

function startRain(container){

  if(rainCleanup){rainCleanup();}
  const drops = [];

  for(let i=0; i<38; i++){
    const drop = document.createElement("div");
    drop.className = "rain-drop";
    drop.style.left = Math.random()*100+"%";
    drop.style.animationDuration = (Math.random()*0.7+0.45)+"s";
    drop.style.animationDelay = (Math.random()*2.2)+"s";
    container.appendChild(drop);
    drops.push(drop);
  }

  const timer = setTimeout(()=>{drops.forEach(d=>{if(d.parentNode)d.remove();});}, 6500);
  rainCleanup = ()=>{clearTimeout(timer); drops.forEach(d=>{if(d.parentNode)d.remove();});};

}

// ================= CLEANUP =================

function cleanupAnimations(){
  if(typedInstance){typedInstance.destroy(); typedInstance=null;}
  if(fwInstance){fwInstance.stop(); fwInstance=null;}
  if(rainCleanup){rainCleanup(); rainCleanup=null;}
}

// ================= STARS =================

const starsEl = document.getElementById("stars");

for(let i=0;i<120;i++){
  const star = document.createElement("div");
  star.classList.add("star");
  star.style.top = Math.random()*100+"%";
  star.style.left = Math.random()*100+"%";
  star.style.animationDuration = (Math.random()*3+2)+"s";
  starsEl.appendChild(star);
}

// ================= ENTER =================

document.getElementById("nama").addEventListener("keypress",function(e){
  if(e.key==="Enter") cekKelulusan();
});

</script>

</body>
</html>
